plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Firebase: the google-services plugin is applied ONLY when you have placed
// your own google-services.json inside the app/ folder. Without it the app
// still compiles and runs in DEMO MODE (local sample data). See README.md.
// ---------------------------------------------------------------------------
def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// ---------------------------------------------------------------------------
// Google Maps API key: read from local.properties (MAPS_API_KEY=...) or from
// an environment variable, so the key is never hard-coded in source control.
// ---------------------------------------------------------------------------
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def mapsApiKey = localProps.getProperty('MAPS_API_KEY', System.getenv('MAPS_API_KEY') ?: '')

android {
    namespace 'com.skillconnect.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.skillconnect.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey.isEmpty() ? "MAPS_API_KEY_NOT_SET" : mapsApiKey]
        buildConfigField "boolean", "MAPS_KEY_CONFIGURED", (!mapsApiKey.isEmpty()).toString()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // AndroidX + Material Design 3
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Firebase (versions managed by the BoM)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'

    // Google Maps + Location
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
